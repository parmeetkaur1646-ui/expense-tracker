<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">
    <div class="icon-badge">₹</div>
    <h1>Expense Tracker</h1>
    <p>Track your expenses and manage your money</p>
  </div>

  <div class="summary-grid">
    <div class="summary-card total">
      <div class="s-icon">💼</div>
      <div class="s-label">Total Budget</div>
      <div class="s-value" id="totalBudgetVal">₹0.00</div>
    </div>
    <div class="summary-card used">
      <div class="s-icon">🛍️</div>
      <div class="s-label">Used Money</div>
      <div class="s-value" id="usedVal">₹0.00</div>
    </div>
    <div class="summary-card remain">
      <div class="s-icon">💰</div>
      <div class="s-label">Remaining</div>
      <div class="s-value" id="remainVal">₹0.00</div>
    </div>
  </div>

  <div class="budget-bar-wrap">
    <div class="budget-bar-top">
      <span id="barPercentLabel">0% used</span>
      <span id="barCountLabel">0 expenses</span>
    </div>
    <div class="budget-bar-track">
      <div class="budget-bar-fill" id="budgetBarFill" style="width:0%"></div>
    </div>
  </div>

  <div class="card">
    <h2>Set Your Budget</h2>
    <div class="set-budget-row">
      <input type="number" id="budgetInput" placeholder="Enter total budget (₹)" min="0" step="0.01">
      <button class="btn-secondary" id="setBudgetBtn">Set Budget</button>
    </div>
  </div>

  <div class="card">
    <h2>Add New Expense</h2>
    <div class="field" style="margin-bottom:14px;">
      <label>Expense Name</label>
      <input type="text" id="expenseName" placeholder="e.g. Grocery Shopping">
    </div>
    <div class="form-row">
      <div class="field">
        <label>Amount (₹)</label>
        <input type="number" id="expenseAmount" placeholder="Enter amount" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="expenseCategory">
          <option value="General">General</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" id="addBtn">+ Add Expense</button>
  </div>

  <div class="card">
    <div class="list-header">
      <div>
        <h2 style="margin-bottom:2px;">Recent Expenses</h2>
        <div class="subtitle">Your expense history</div>
      </div>
      <button class="clear-btn" id="clearAllBtn">Clear All</button>
    </div>
    <ul id="expenseList"></ul>
    <p class="empty-msg" id="emptyMsg">No expenses added yet.</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
